<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NyaLife</title>
  <meta name="theme-color" content="#ffd884" />
  <style>
    :root {
      --bg1: #fff4dc;
      --bg2: #ffe7c2;
      --panel: rgba(255,255,255,0.9);
      --panel-border: #f4d89c;
      --ink: #3d2d28;
      --muted: #7f665d;
      --primary: #ffb35d;
      --accent: #ff9f82;
      --shadow: rgba(89,61,39,0.14);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--ink);
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
    }

    .badge {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.85);
      border: 2px solid var(--panel-border);
      font-weight: 800;
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: 1.5fr 0.9fr;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 3px solid var(--panel-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 12px 28px var(--shadow);
    }

    .stage {
      position: relative;
      height: 320px;
      border-radius: 18px;
      background: linear-gradient(180deg, #fdfbf7, #ebf6ff);
      overflow: hidden;
      border: 2px dashed #f3d9a6;
    }

    .cat-wrap {
      position: absolute;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%);
      width: 160px;
      height: 160px;
      display: grid;
      place-items: center;
      transition: transform 0.18s ease;
    }

    .cat-wrap svg {
      width: 150px;
      height: 150px;
      image-rendering: pixelated;
      display: block;
      filter: drop-shadow(0 8px 12px rgba(80,55,30,0.12));
    }

    .speech {
      position: absolute;
      right: 12px;
      top: 12px;
      background: rgba(255,255,255,0.9);
      border: 2px solid var(--panel-border);
      border-radius: 14px;
      padding: 8px 10px;
      font-weight: 800;
      color: var(--muted);
    }

    .bars {
      margin-top: 12px;
      display: grid;
      gap: 9px;
    }

    .bar-frame {
      position: relative;
      height: 22px;
      border-radius: 999px;
      background: #f4efe7;
      border: 1px solid #e4d8b8;
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 50%;
      border-radius: inherit;
      transition: width 0.25s ease;
    }

    .bar-hunger { background: linear-gradient(90deg, #ffbd44, #ff8e5c); }
    .bar-happiness { background: linear-gradient(90deg, #6ee0b0, #4db6d9); }
    .bar-energy { background: linear-gradient(90deg, #b8b0ff, #7f9aff); }

    .side { display: grid; gap: 12px; }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(80,53,30,0.06);
      -webkit-tap-highlight-color: transparent;
    }

    .action-primary {
      background: linear-gradient(135deg, #ffd884, #ff9f82);
      color: #402c1e;
    }

    .action-secondary {
      background: linear-gradient(135deg, #dff9ea, #bfead6);
      color: #1b4a3e;
    }

    .message-box {
      min-height: 72px;
      background: #fffaf2;
      border: 2px solid #efdca9;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 700;
      line-height: 1.5;
    }

    .log {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
    }

    .log li {
      background: #fffaf3;
      border: 1px solid #f1ddb2;
      border-radius: 10px;
      padding: 8px;
      color: var(--muted);
    }

    .mobile-bar {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(255,255,255,0.95));
      border-top: 2px solid #f1d9a5;
      box-shadow: 0 -8px 20px rgba(60,40,20,0.08);
      z-index: 60;
    }

    .mobile-bar .btn {
      min-width: 0;
      flex: 1;
      margin: 0 6px;
      border-radius: 14px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .mobile-bar .label {
      font-size: 12px;
      margin-top: 4px;
    }

    .tap-large {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .side { order: 3; }
    }

    @media (max-width: 600px) {
      .layout { grid-template-columns: 1fr; }
      .side { display: none; }
      .mobile-bar { display: flex; gap: 6px; }
      .app { padding-bottom: 140px; }
      h1 { font-size: 1.4rem; }
      .cat-wrap { width: 140px; height: 140px; }
      .cat-wrap svg { width: 140px; height: 140px; }
      .stage { height: 300px; }
      .bars .bar-frame { height: 20px; }
      button { font-size: 0.98rem; }
    }
  </style>
</head>

  <div class="app">
    <header>
      <h1>🐾 NyaLife</h1>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <div class="badge">📅 Day <span id="dayValue">1</span></div>
        <div class="badge">💰 <span id="coinValue">0</span></div>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="stage">
          <div class="speech" id="speechBox">にゃー！</div>
          <div class="cat-wrap" id="catFace">
            <svg id="catSvg" viewBox="0 0 16 16" aria-label="pixel cat"></svg>
          </div>
        </div>

        <div class="bars">
          <div>
            <div style="display:flex;justify-content:space-between;font-weight:800;color:var(--muted);margin-bottom:6px;">
              <span>空腹度</span><span id="hungerText">70%</span>
            </div>
            <div class="bar-frame"><div id="hungerBar" class="bar-fill bar-hunger" style="width:70%"></div></div>
          </div>

          <div>
            <div style="display:flex;justify-content:space-between;font-weight:800;color:var(--muted);margin-bottom:6px;">
              <span>幸福度</span><span id="happinessText">75%</span>
            </div>
            <div class="bar-frame"><div id="happinessBar" class="bar-fill bar-happiness" style="width:75%"></div></div>
          </div>

          <div>
            <div style="display:flex;justify-content:space-between;font-weight:800;color:var(--muted);margin-bottom:6px;">
              <span>体力</span><span id="energyText">80%</span>
            </div>
            <div class="bar-frame"><div id="energyBar" class="bar-fill bar-energy" style="width:80%"></div></div>
          </div>
        </div>

        <div style="display:flex;gap:12px;margin-top:12px;">
          <div style="flex:1;padding:10px 12px;border:2px solid var(--panel-border);border-radius:14px;background:rgba(255,255,255,0.7);">
            <div style="font-weight:800;color:var(--muted);">名前</div>
            <div id="catName" style="font-size:1.1rem;font-weight:900;">たま</div>
          </div>
          <div style="width:120px;padding:10px 12px;border:2px solid var(--panel-border);border-radius:14px;background:rgba(255,255,255,0.7);">
            <div style="font-weight:800;color:var(--muted);">レベル</div>
            <div id="levelValue" style="font-size:1.1rem;font-weight:900;">1</div>
          </div>
        </div>
      </section>

      <aside class="side">
        <section class="panel">
          <div class="controls">
            <button class="action-primary tap-large" data-action="feed">🍲<div style="font-size:12px;margin-top:6px;">ごはん</div></button>
            <button class="action-primary tap-large" data-action="play">🎾<div style="font-size:12px;margin-top:6px;">遊ぶ</div></button>
            <button class="action-primary tap-large" data-action="pet">🐾<div style="font-size:12px;margin-top:6px;">なでる</div></button>
            <button class="action-secondary tap-large" data-action="sleep">💤<div style="font-size:12px;margin-top:6px;">ねる</div></button>
            <button class="action-secondary tap-large" data-action="shop">🛍️<div style="font-size:12px;margin-top:6px;">おやつ</div></button>
            <button id="saveBtn" class="action-secondary tap-large">💾<div style="font-size:12px;margin-top:6px;">セーブ</div></button>
          </div>
          <div style="height:12px"></div>
          <div class="message-box" id="messageBox">ふわふわの猫ちゃんと、新しい日が始まるにゃ！</div>
        </section>

        <section class="panel">
          <h3 style="margin:0 0 8px 0;">イベント</h3>
          <div id="eventText">今日の運勢：普通</div>
          <ul id="logList" class="log" style="margin-top:10px;"></ul>
        </section>
      </aside>
    </main>

    <div class="mobile-bar" role="toolbar" aria-label="アクション">

      <button class="btn action-secondary" data-action="sleep" title="ねる">💤<div class="label">ねる</div></button>
    </div>
  </div>

          [5,12,"#9e5d3d"],[6,12,"#9e5d3d"],[8,12,"#9e5d3d"],[9,12,"#9e5d3d"],
          [2,1,"#f4ca98"],[3,1,"#f4ca98"],[4,1,"#f4ca98"],[5,1,"#f4ca98"],[6,1,"#f4ca98"],[7,1,"#f4ca98"],[8,1,"#f4ca98"],[9,1,"#f4ca98"],[10,1,"#f4ca98"],[11,1,"#f4ca98"],
          [2,2,"#f4ca98"],[3,2,"#f4ca98"],[4,2,"#f4ca98"],[5,2,"#f4ca98"],[6,2,"#f4ca98"],[7,2,"#f4ca98"],[8,2,"#f4ca98"],[9,2,"#f4ca98"],[10,2,"#f4ca98"],[11,2,"#f4ca98"],
          [3,3,"#f3bf82"],[4,3,"#f3bf82"],[5,3,"#f3bf82"],[6,3,"#f3bf82"],[7,3,"#f3bf82"],[8,3,"#f3bf82"],[9,3,"#f3bf82"],[10,3,"#f3bf82"],
          [3,4,"#e5af7a"],[4,4,"#e5af7a"],[5,4,"#e5af7a"],[6,4,"#e5af7a"],[7,4,"#e5af7a"],[8,4,"#e5af7a"],[9,4,"#e5af7a"],[10,4,"#e5af7a"],
          [1,0,"#d79b67"],[2,0,"#d79b67"],[3,0,"#d79b67"],[4,0,"#d79b67"],[9,0,"#d79b67"],[10,0,"#d79b67"],[11,0,"#d79b67"],[12,0,"#d79b67"],
          [4,1,"#d79b67"],[9,1,"#d79b67"],[5,3,"#241c1a"],[10,3,"#241c1a"],[7,4,"#d8847c"],[8,4,"#d8847c"],
          [3,5,"#f2d7ad"],[4,5,"#f2d7ad"],[10,5,"#f2d7ad"],[11,5,"#f2d7ad"],
          [2,6,"#f2d7ad"],[12,6,"#f2d7ad"],[6,8,"#f7d6a4"],[7,8,"#f7d6a4"],[8,8,"#f7d6a4"]
        ]
      ]
    };

    let state = null;
    let spriteIndex = 0;
    let spriteTimer = null;

    function clamp(v, min, max) {
      return Math.min(Math.max(v, min), max);
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(defaultState));
        return { ...JSON.parse(JSON.stringify(defaultState)), ...JSON.parse(raw) };
      } catch (e) {
        console.warn('セーブ読み込み失敗', e);
        return JSON.parse(JSON.stringify(defaultState));
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function addLog(text) {
      state.log.unshift(text);
      state.log = state.log.slice(0, 6);
    }

    function getMoodText() {
      if (state.hunger < 25) return 'お腹すいたにゃ';
      if (state.happiness < 25) return 'さみしいにゃ';
      if (state.energy < 25) return '眠いにゃ';
      if (state.happiness > 80 && state.hunger > 55) return '最高に幸せ';
      return '元気';
    }

    function renderPixelCat() {
      const svg = document.getElementById('catSvg');
      if (!svg) return;

      const activeFrame = catFrames.idle[spriteIndex % catFrames.idle.length];
      svg.innerHTML = '';

      const ns = 'http://www.w3.org/2000/svg';
      const rects = activeFrame;

      rects.forEach(([x, y, color]) => {
        const rect = document.createElementNS(ns, 'rect');
        rect.setAttribute('x', x);
        rect.setAttribute('y', y);
        rect.setAttribute('width', '1');
        rect.setAttribute('height', '1');
        rect.setAttribute('fill', color);
        svg.appendChild(rect);
      });
    }

    function setMessage(msg) {
      const el = document.getElementById('messageBox');
      if (el) el.textContent = msg;
    }

    function startIdleAnimation() {
      if (spriteTimer) clearInterval(spriteTimer);

      spriteTimer = setInterval(() => {
        const cat = document.getElementById('catFace');
        if (cat) {
          const sway = Math.sin(Date.now() / 180) * 6;
          cat.style.transform = 'translateX(-50%) rotate(' + sway + 'deg) translateY(' + (Math.abs(Math.sin(Date.now() / 280)) * 4) + 'px)';
        }

        spriteIndex = (spriteIndex + 1) % catFrames.idle.length;
        renderPixelCat();
      }, 430);
    }

    function playActionAnimation(sequence, interval) {
      if (spriteTimer) clearInterval(spriteTimer);

      let i = 0;
      const seq = setInterval(() => {
        spriteIndex = sequence[i % sequence.length];
        renderPixelCat();

        const cat = document.getElementById('catFace');
        if (cat) {
          const tilt = i % 2 === 0 ? 10 : -10;
          cat.style.transform = 'translateX(-50%) rotate(' + tilt + 'deg)';
        }

        i += 1;
        if (i >= sequence.length) {
          clearInterval(seq);
          startIdleAnimation();
        }
      }, interval);
    }

    function gainXP(amount) {
      state.xp += amount;
      while (state.xp >= 100) {
        state.xp -= 100;
        state.level += 1;
        state.coins += 10;
        addLog('レベルアップ！ Lv.' + state.level + ' にゃ！');
      }
    }

    function updateUI() {
      const h = clamp(state.hunger, 0, 100);
      const p = clamp(state.happiness, 0, 100);
      const e = clamp(state.energy, 0, 100);

      document.getElementById('dayValue').textContent = String(state.day);
      document.getElementById('coinValue').textContent = String(state.coins);
      document.getElementById('catName').textContent = state.name;
      document.getElementById('levelValue').textContent = String(state.level);
      document.getElementById('hungerText').textContent = h + '%';
      document.getElementById('happinessText').textContent = p + '%';
      document.getElementById('energyText').textContent = e + '%';
      document.getElementById('hungerBar').style.width = h + '%';
      document.getElementById('happinessBar').style.width = p + '%';
      document.getElementById('energyBar').style.width = e + '%';
      document.getElementById('eventText').textContent = '今日の運勢：' + state.eventMood;
      document.getElementById('speechBox').textContent = getMoodText();

      const log = document.getElementById('logList');
      log.innerHTML = '';
      state.log.forEach((entry) => {
        const li = document.createElement('li');
        li.textContent = entry;
        log.appendChild(li);
      });

      renderPixelCat();
    }

    function randomEvent() {
      const events = [
        { text: 'お散歩��コウラさんと出会ったにゃ！', mood: 'いい日', bonus: { coins: 8, happiness: 6 } },
        { text: '日向ぼっこで大満足だったにゃ。', mood: '晴れ', bonus: { happiness: 12 } },
        { text: 'キッチンでおやつの匂いを嗅いだにゃ！', mood: 'ラッキー', bonus: { hunger: 10, coins: 5 } },
        { text: '小さな声で「もっと遊んで」と言ってるにゃ。', mood: '普通', bonus: { happiness: 8 } }
      ];

      const pick = events[Math.floor(Math.random() * events.length)];
      state.eventMood = pick.mood;
      if (pick.bonus.coins) state.coins += pick.bonus.coins;
      if (pick.bonus.happiness) state.happiness = clamp(state.happiness + pick.bonus.happiness, 0, 100);
      if (pick.bonus.hunger) state.hunger = clamp(state.hunger + pick.bonus.hunger, 0, 100);
      addLog(pick.text);
      setMessage(pick.text);
      saveState();
      updateUI();
    }

    function performAction(action) {
      if (action === 'feed') {
        state.hunger = clamp(state.hunger + 22, 0, 100);
        state.happiness = clamp(state.happiness + 8, 0, 100);
        gainXP(12);
        addLog('ご飯で満腹になったにゃ！');
        setMessage('おいしいごはんで、満足そうな顔にゃ！');
        playActionAnimation([0, 1, 0], 140);
      }

      if (action === 'play') {
        state.happiness = clamp(state.happiness + 20, 0, 100);
        state.energy = clamp(state.energy - 12, 0, 100);
        state.hunger = clamp(state.hunger - 8, 0, 100);
        gainXP(16);
        addLog('遊んで楽しかったにゃ！');
        setMessage('おもいっきり遊んで、にゃんと笑ってるにゃ！');
        playActionAnimation([0, 1, 0], 120);
      }

      if (action === 'pet') {
        state.happiness = clamp(state.happiness + 14, 0, 100);
        state.energy = clamp(state.energy + 5, 0, 100);
        gainXP(8);
        addLog('なでられて幸せにゃ');
        setMessage('なでるとすぐに甘えてくる、最高のパートナーにゃ！');
        playActionAnimation([1, 0, 1], 180);
      }

      if (action === 'sleep') {
        state.energy = clamp(state.energy + 28, 0, 100);
        state.hunger = clamp(state.hunger - 10, 0, 100);
        state.happiness = clamp(state.happiness + 6, 0, 100);
        gainXP(10);
        addLog('ぐっすり眠って元気になったにゃ');
        setMessage('良い夢を見て、すっかりリフレッシュしたにゃ！');
        playActionAnimation([1, 0, 1], 220);
      }

      if (action === 'shop') {
        if (state.coins >= 15) {
          state.coins -= 15;
          state.happiness = clamp(state.happiness + 12, 0, 100);
          state.hunger = clamp(state.hunger + 8, 0, 100);
          gainXP(12);
          addLog('おやつを買って喜んだにゃ！');
          setMessage('豪華おやつでさらに幸せにゃ！');
        } else {
          addLog('コインが足りないにゃ…');
          setMessage('おやつを買うにはコインが15必要だにゃ');
        }
      }

      state.day += 1;
      saveState();
      updateUI();
    }

    function tick() {
      state.hunger = clamp(state.hunger - 3, 0, 100);
      state.happiness = clamp(state.happiness - 2, 0, 100);
      state.energy = clamp(state.energy - 2, 0, 100);

      if (Math.random() < 0.18) {
        randomEvent();
      }

      if (state.hunger <= 20) {
        setMessage('お腹が空いてるにゃ…ごはんをあげてほしいにゃ');
      } else if (state.energy <= 20) {
        setMessage('疲れたにゃ…休ませてあげてほしいにゃ');
      } else if (state.happiness <= 20) {
        setMessage('少し寂しいにゃ…なでてあげてほしいにゃ');
      }

      saveState();
      updateUI();
    }

    function resetGame() {
      if (!confirm('本当にリセットしますか？')) return;
      state = JSON.parse(JSON.stringify(defaultState));
      saveState();
      setMessage('新しい生活にスタートしたにゃ！');
      updateUI();
    }

    document.addEventListener('click', (event) => {
      const btn = event.target.closest('[data-action]');
      if (btn) {
        performAction(btn.dataset.action);
      }
    });

    document.getElementById('saveBtn')?.addEventListener('click', () => {
      saveState();
      setMessage('セーブしたにゃ！');
    });

    document.getElementById('resetBtn')?.addEventListener('click', resetGame);

    state = loadState();
    spriteIndex = 0;
    updateUI();
    setMessage('ふわふわの猫ちゃんと、新しい日が始まるにゃ！');
    startIdleAnimation();
    setInterval(tick, 10000);
  </script>
</body>
</html>
