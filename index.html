<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NyaLife - Cat Life RPG</title>
  <style>
    :root {
      --bg1: #fff4dc;
      --bg2: #ffe7c2;
      --panel: rgba(255, 255, 255, 0.82);
      --panel-border: #f4d89c;
      --ink: #3d2d28;
      --muted: #7f665d;
      --primary: #ffb35d;
      --primary-dark: #f28a52;
      --green: #75d3a6;
      --blue: #7ab4ff;
      --pink: #ffb5c5;
      --red: #f58080;
      --shadow: rgba(89, 61, 39, 0.14);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--ink);
    }

    body {
      min-height: 100vh;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 4vw, 3.3rem);
      letter-spacing: 0.08em;
    }

    .header-tools {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid var(--panel-border);
      border-radius: 999px;
      font-weight: 800;
      color: var(--muted);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.03);
    }

    .layout {
      display: grid;
      grid-template-columns: 1.5fr 0.9fr;
      gap: 22px;
    }

    .panel {
      background: var(--panel);
      border: 3px solid var(--panel-border);
      border-radius: 28px;
      box-shadow: 0 14px 32px var(--shadow);
      padding: 22px;
    }

    .stage-wrap {
      position: relative;
      overflow: hidden;
    }

    .stage {
      position: relative;
      height: 360px;
      background: linear-gradient(180deg, #fdfbf7 0%, #ebf6ff 44%, #dfeecf 100%);
      border-radius: 24px;
      border: 2px dashed #f3d9a6;
      overflow: hidden;
    }

    .sky {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(125, 180, 255, 0.12));
    }

    .sun {
      position: absolute;
      top: 24px;
      right: 46px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff9cc 0%, #ffd877 44%, #ffc452 100%);
      box-shadow: 0 0 25px rgba(255, 194, 83, 0.55);
    }

    .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 78px;
      background: linear-gradient(180deg, #cfe8ad, #8fcf7b);
      border-top: 3px solid rgba(72, 123, 69, 0.4);
    }

    .cat {
      position: absolute;
      left: 50%;
      bottom: 78px;
      transform: translateX(-50%);
      font-size: 150px;
      line-height: 1;
      filter: drop-shadow(0 18px 14px rgba(87, 63, 35, 0.12));
      animation: sway 2.8s ease-in-out infinite;
      user-select: none;
    }

    @keyframes sway {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-10px); }
    }

    .speech {
      position: absolute;
      right: 20px;
      top: 18px;
      background: rgba(255,255,255,0.84);
      border: 2px solid var(--panel-border);
      border-radius: 16px;
      padding: 8px 12px;
      font-weight: 800;
      color: var(--muted);
      box-shadow: 0 10px 18px rgba(92, 71, 57, 0.08);
    }

    .stats {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 12px;
    }

    .stat-card {
      background: #fffdf8;
      border: 2px solid #f5e1b6;
      border-radius: 16px;
      padding: 12px 10px;
      text-align: center;
    }

    .stat-card .label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-card strong {
      font-size: clamp(1.1rem, 2vw, 1.7rem);
    }

    .bars {
      margin-top: 18px;
      display: grid;
      gap: 12px;
    }

    .bar-row {
      display: grid;
      gap: 6px;
    }

    .bar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .bar-frame {
      position: relative;
      height: 18px;
      border-radius: 999px;
      background: #f4efe7;
      border: 1px solid #e4d8b8;
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 50%;
      border-radius: inherit;
      transition: width 0.25s ease;
    }

    .bar-hunger { background: linear-gradient(90deg, #ffbd44, #ff8e5c); }
    .bar-happiness { background: linear-gradient(90deg, #6ee0b0, #4db6d9); }
    .bar-energy { background: linear-gradient(90deg, #b8b0ff, #7f9aff); }

    .quests {
      margin-top: 20px;
      padding: 16px 18px;
      background: linear-gradient(135deg, #fff9ef, #fff2d6);
      border: 2px solid #f1d9a5;
      border-radius: 18px;
    }

    .quests h3 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }

    .quest-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
      color: var(--muted);
    }

    .quest-list li {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quest-list li::before {
      content: "✨";
    }

    .side {
      display: grid;
      gap: 18px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 16px;
      padding: 14px 12px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 10px 18px rgba(80, 53, 30, 0.08);
    }

    button:hover {
      transform: translateY(-1px) scale(1.01);
      filter: brightness(1.02);
    }

    .action-primary { background: linear-gradient(135deg, #ffd884, #ff9f82); color: #402c1e; }
    .action-secondary { background: linear-gradient(135deg, #dff9ea, #bfead6); color: #1b4a3e; }
    .action-danger { background: linear-gradient(135deg, #ffdfe0, #ffb8b8); color: #5d2a2e; }

    .message-box {
      min-height: 92px;
      background: #fffaf2;
      border: 2px solid #efdca9;
      border-radius: 18px;
      padding: 14px 16px;
      line-height: 1.6;
      color: #453a2f;
      font-weight: 600;
    }

    .log {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
    }

    .log li {
      padding: 10px 12px;
      border-radius: 11px;
      background: #fffaf3;
      border: 1px solid #f1ddb2;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .mini-card {
      background: linear-gradient(135deg, #fffaf1, #f9f4ff);
      border: 2px solid #edd9ff;
      border-radius: 20px;
      padding: 16px;
    }

    .mini-card h3 {
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .reward-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .reward-grid .box {
      padding: 10px 8px;
      border-radius: 14px;
      text-align: center;
      font-weight: 800;
      color: #46362a;
      background: #fffdfc;
      border: 1px solid #f0d9bf;
    }

    .event-pulse {
      display: inline-block;
      margin-left: 8px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }

    @media (max-width: 840px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🐾 NyaLife</h1>
      <div class="header-tools">
        <div class="badge">📅 Day <span id="dayValue">1</span></div>
        <div class="badge">💰 <span id="coinValue">0</span> コイン</div>
      </div>
    </header>

    <main class="layout">
      <section class="panel stage-wrap">
        <div class="stage">
          <div class="sky"></div>
          <div class="sun"></div>
          <div class="speech" id="speechBox">にゃー！</div>
          <div class="cat" id="catFace">🐱</div>
          <div class="ground"></div>
        </div>

        <div class="stats">
          <div class="stat-card">
            <span class="label">名前</span>
            <strong id="catName">たま</strong>
          </div>
          <div class="stat-card">
            <span class="label">レベル</span>
            <strong id="levelValue">1</strong>
          </div>
          <div class="stat-card">
            <span class="label">EXP</span>
            <strong id="xpValue">0 / 100</strong>
          </div>
          <div class="stat-card">
            <span class="label">状態</span>
            <strong id="statusText">元気</strong>
          </div>
        </div>

        <div class="bars">
          <div class="bar-row">
            <div class="bar-head"><span>空腹度</span><span id="hungerText">70%</span></div>
            <div class="bar-frame"><div id="hungerBar" class="bar-fill bar-hunger"></div></div>
          </div>
          <div class="bar-row">
            <div class="bar-head"><span>幸福度</span><span id="happinessText">75%</span></div>
            <div class="bar-frame"><div id="happinessBar" class="bar-fill bar-happiness"></div></div>
          </div>
          <div class="bar-row">
            <div class="bar-head"><span>体力</span><span id="energyText">80%</span></div>
            <div class="bar-frame"><div id="energyBar" class="bar-fill bar-energy"></div></div>
          </div>
        </div>

        <div class="quests">
          <h3>今日の目標</h3>
          <ul class="quest-list" id="questList">
            <li>ごはんを食べさせる</li>
            <li>一緒に遊ぶ</li>
            <li>元気な状態を保つ</li>
          </ul>
        </div>
      </section>

      <aside class="side">
        <section class="panel">
          <div class="controls">
            <button class="action-primary" data-action="feed">🍲 ごはん</button>
            <button class="action-primary" data-action="play">🎾 遊ぶ</button>
            <button class="action-primary" data-action="pet">🐾 ��でる</button>
            <button class="action-primary" data-action="clean">🧼 清掃</button>
            <button class="action-secondary" data-action="sleep">💤 ねる</button>
            <button class="action-secondary" data-action="shop">🛍️ おやつ</button>
            <button class="action-secondary" id="saveBtn" type="button">💾 セーブ</button>
            <button class="action-danger" id="resetBtn" type="button">🔄 リセット</button>
          </div>

          <div class="message-box" id="messageBox" style="margin-top: 18px;">
            ふわふわの猫ちゃんと、新しい日が始まるにゃ！
          </div>
        </section>

        <section class="panel mini-card">
          <h3>イベント <span class="event-pulse">✨</span></h3>
          <div id="eventText">今日の運勢：普通</div>
          <div class="reward-grid">
            <div class="box">❤️ <span id="loveValue">0</span></div>
            <div class="box">�� <span id="starValue">0</span></div>
            <div class="box">🐟 <span id="fishValue">0</span></div>
            <div class="box">🧶 <span id="toyValue">0</span></div>
          </div>
        </section>

        <section class="panel">
          <h3 style="margin-top: 0; margin-bottom: 12px;">ログ</h3>
          <ul id="logList" class="log"></ul>
        </section>
      </aside>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "nyalife-rpg-v2";

    const defaultState = {
      name: "たま",
      level: 1,
      xp: 0,
      hunger: 70,
      happiness: 75,
      energy: 80,
      coins: 0,
      love: 0,
      stars: 0,
      fish: 0,
      toy: 0,
      day: 1,
      log: ["今日も元気に過ごしてるにゃ！"],
      eventMood: "普通",
      currentTask: "ごはんを用意する"
    };

    let state = loadState();

    function clamp(v, min, max) {
      return Math.min(Math.max(v, min), max);
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(defaultState));
        return { ...JSON.parse(JSON.stringify(defaultState)), ...JSON.parse(raw) };
      } catch (e) {
        console.warn("セーブデータの読み込みに失敗しました", e);
        return JSON.parse(JSON.stringify(defaultState));
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function addLog(text) {
      state.log.unshift(text);
      state.log = state.log.slice(0, 6);
    }

    function getMoodText() {
      if (state.hunger < 25) return "お腹すいたにゃ";
      if (state.happiness < 25) return "さみしいにゃ";
      if (state.energy < 25) return "眠いにゃ";
      if (state.happiness > 80 && state.hunger > 55) return "最高に幸せ";
      return "元気";
    }

    function getCatFace() {
      const mood = getMoodText();
      if (mood.includes("眠")) return "😴";
      if (mood.includes("お腹")) return "😿";
      if (mood.includes("さみ")) return "😹";
      if (mood.includes("最高")) return "😺";
      return "🐱";
    }

    function updateQuestText() {
      const tasks = [
        `ごはんを食べさせる（${Math.max(0, 100 - state.hunger)}% まで）`,
        `一緒に遊ぶ（幸福度 ${state.happiness}%）`,
        `体力を回復させる（エネルギー ${state.energy}%）`
      ];
      const questList = document.getElementById("questList");
      questList.innerHTML = tasks.map(item => `<li>${item}</li>`).join("");
    }

    function gainXP(amount) {
      state.xp += amount;
      while (state.xp >= 100) {
        state.xp -= 100;
        state.level += 1;
        state.coins += 10;
        addLog(`レベルアップ！ Lv.${state.level} にゃ！`);
      }
    }

    function updateUI() {
      const hunger = clamp(state.hunger, 0, 100);
      const happiness = clamp(state.happiness, 0, 100);
      const energy = clamp(state.energy, 0, 100);

      document.getElementById("dayValue").textContent = String(state.day);
      document.getElementById("coinValue").textContent = String(state.coins);
      document.getElementById("catName").textContent = state.name;
      document.getElementById("levelValue").textContent = String(state.level);
      document.getElementById("xpValue").textContent = `${state.xp} / 100`;
      document.getElementById("statusText").textContent = getMoodText();
      document.getElementById("catFace").textContent = getCatFace();
      document.getElementById("speechBox").textContent = getMoodText();

      document.getElementById("hungerText").textContent = `${hunger}%`;
      document.getElementById("happinessText").textContent = `${happiness}%`;
      document.getElementById("energyText").textContent = `${energy}%`;
      document.getElementById("hungerBar").style.width = `${hunger}%`;
      document.getElementById("happinessBar").style.width = `${happiness}%`;
      document.getElementById("energyBar").style.width = `${energy}%`;

      document.getElementById("loveValue").textContent = String(state.love);
      document.getElementById("starValue").textContent = String(state.stars);
      document.getElementById("fishValue").textContent = String(state.fish);
      document.getElementById("toyValue").textContent = String(state.toy);
      document.getElementById("eventText").textContent = `今日の運勢：${state.eventMood}`;

      const logList = document.getElementById("logList");
      logList.innerHTML = "";
      state.log.forEach((entry) => {
        const li = document.createElement("li");
        li.textContent = entry;
        logList.appendChild(li);
      });

      updateQuestText();
    }

    function setMessage(msg) {
      document.getElementById("messageBox").textContent = msg;
    }

    function randomEvent() {
      const events = [
        { text: "お散歩でコウラさんと出会ったにゃ！", mood: "いい日", bonus: { coins: 8, love: 6 } },
        { text: "日向ぼっこで大満足だったにゃ。", mood: "晴れ", bonus: { happiness: 12, stars: 1 } },
        { text: "キッチンでおやつの匂いを嗅いだにゃ！", mood: "ラッキー", bonus: { hunger: 10, coins: 5 } },
        { text: "小さな声で『もっと遊んで』と言ってるにゃ。", mood: "普通", bonus: { happiness: 8, love: 3 } },
        { text: "雨の日でも抱きつかれると安心するにゃ。", mood: "静か", bonus: { energy: 6, love: 4 } }
      ];

      const pick = events[Math.floor(Math.random() * events.length)];
      state.eventMood = pick.mood;
      if (pick.bonus.coins) state.coins += pick.bonus.coins;
      if (pick.bonus.love) state.love += pick.bonus.love;
      if (pick.bonus.stars) state.stars += pick.bonus.stars;
      if (pick.bonus.happiness) state.happiness = clamp(state.happiness + pick.bonus.happiness, 0, 100);
      if (pick.bonus.hunger) state.hunger = clamp(state.hunger + pick.bonus.hunger, 0, 100);
      if (pick.bonus.energy) state.energy = clamp(state.energy + pick.bonus.energy, 0, 100);
      addLog(pick.text);
      setMessage(pick.text);
      saveState();
      updateUI();
    }

    function performAction(type) {
      if (type === "feed") {
        state.hunger = clamp(state.hunger + 22, 0, 100);
        state.happiness = clamp(state.happiness + 8, 0, 100);
        state.energy = clamp(state.energy + 3, 0, 100);
        state.fish += 1;
        gainXP(12);
        addLog("ご飯で満腹になったにゃ！");
        setMessage("おいしいごはんで、満足そうな顔にゃ！");
      }

      if (type === "play") {
        state.happiness = clamp(state.happiness + 20, 0, 100);
        state.energy = clamp(state.energy - 12, 0, 100);
        state.hunger = clamp(state.hunger - 8, 0, 100);
        state.toy += 1;
        gainXP(16);
        addLog("キャッチボールで遊んで、めちゃくちゃ楽しかったにゃ！");
        setMessage("おもいっきり遊んだので、今日の最高ランクにゃ！");
      }

      if (type === "pet") {
        state.happiness = clamp(state.happiness + 14, 0, 100);
        state.energy = clamp(state.energy + 5, 0, 100);
        state.love += 5;
        gainXP(8);
        addLog("なでられて、びっくりしながら幸せそうにゃ");
        setMessage("なでるとすぐに甘えてくる、最高のパートナーにゃ！");
      }

      if (type === "clean") {
        state.happiness = clamp(state.happiness + 10, 0, 100);
        state.energy = clamp(state.energy - 4, 0, 100);
        state.coins += 5;
        state.stars += 1;
        gainXP(10);
        addLog("部屋がきれいになって、猫が安心したにゃ");
        setMessage("清潔な部屋で、すやすやしてるにゃ！");
      }

      if (type === "sleep") {
        state.energy = clamp(state.energy + 28, 0, 100);
        state.hunger = clamp(state.hunger - 10, 0, 100);
        state.happiness = clamp(state.happiness + 6, 0, 100);
        gainXP(10);
        addLog("ぐっすり眠って、元気が戻ったにゃ");
        setMessage("良い夢を見て、すっかりリフレッシュしたにゃ！");
      }

      if (type === "shop") {
        if (state.coins >= 15) {
          state.coins -= 15;
          state.happiness = clamp(state.happiness + 12, 0, 100);
          state.hunger = clamp(state.hunger + 8, 0, 100);
          state.love += 4;
          gainXP(12);
          addLog("おやつを買って、びっくりしたくらい喜んだにゃ！");
          setMessage("今日の豪華おやつで、さらに幸せな気分にゃ！");
        } else {
          addLog("コインが足りないにゃ…");
          setMessage("おやつを買うにはコインが15必要だにゃ");
        }
      }

      state.day += 1;
      saveState();
      updateUI();
    }

    function tick() {
      state.hunger = clamp(state.hunger - 3, 0, 100);
      state.happiness = clamp(state.happiness - 2, 0, 100);
      state.energy = clamp(state.energy - 2, 0, 100);

      if (Math.random() < 0.18) {
        randomEvent();
      }

      if (state.hunger <= 20) {
        setMessage("お腹が空いてるにゃ…ごはんをあげてほしいにゃ");
      } else if (state.energy <= 20) {
        setMessage("疲れたにゃ…休ませてあげてほしいにゃ");
      } else if (state.happiness <= 20) {
        setMessage("少し寂しいにゃ…なでてあげてほしいにゃ");
      }

      saveState();
      updateUI();
    }

    function resetGame() {
      const ok = window.confirm("本当にリセットしますか？");
      if (!ok) return;
      state = JSON.parse(JSON.stringify(defaultState));
      saveState();
      setMessage("新しい生活にスタートしたにゃ！");
      updateUI();
    }

    document.querySelectorAll("[data-action]").forEach((button) => {
      button.addEventListener("click", () => {
        performAction(button.dataset.action);
      });
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
      saveState();
      setMessage("セーブしたにゃ！");
    });

    document.getElementById("resetBtn").addEventListener("click", resetGame);

    updateUI();
    setMessage("ふわふわの猫ちゃんと、新しい日が始まるにゃ！");
    setInterval(tick, 10000);
  </script>
</body>
</html>
