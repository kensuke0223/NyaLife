<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NyaLife Phase1</title><style>body{margin:0;font-family:sans-serif;background:#fff2d7;text-align:center}.container{max-width:700px;margin:auto;padding:20px}.cat{font-size:150px}.panel{background:#fff;padding:20px;border-radius:15px;margin-top:20px;box-shadow:0 0 10px rgba(0,0,0,.1)}button{padding:12px 20px;margin:5px;border:none;border-radius:10px;cursor:pointer}.feed{background:#ffb703}.play{background:#8ecae6}.sleep{background:#bdb2ff}.reset{background:#ef476f;color:#fff}.bar{width:100%;height:25px;background:#ddd;border-radius:20px;overflow:hidden}.fill{height:100%}.hunger{background:#ffb703}.happy{background:#06d6a0}input{padding:10px}</style></head><body><div class="container"><h1>🐱 NyaLife</h1><div class="cat">🐱</div><div class="panel"><p>猫の名前：<input id="catName"><button onclick="saveName()">決定</button></p><h2 id="displayName">たま</h2><p>レベル:<span id="level">1</span></p><p>経験値:<span id="xp">0</span>/100</p><p>空腹度</p><div class="bar"><div class="fill hunger" id="hungerBar"></div></div><p>幸福度</p><div class="bar"><div class="fill happy" id="happyBar"></div></div><br><button class="feed" onclick="feed()">🍖 ごはん</button><button class="play" onclick="play()">🎾 遊ぶ</button><button class="sleep" onclick="sleepCat()">💤 寝る</button><button class="reset" onclick="resetGame()">🗑 リセット</button><div id="message"></div></div></div><script>let cat={name:'たま',level:1,xp:0,hunger:50,happy:50};function loadGame(){const s=localStorage.getItem('nyalife');if(s)cat=JSON.parse(s);updateUI()}function saveGame(){localStorage.setItem('nyalife',JSON.stringify(cat))}function updateUI(){displayName.textContent=cat.name;level.textContent=cat.level;xp.textContent=cat.xp;hungerBar.style.width=cat.hunger+'%';happyBar.style.width=cat.happy+'%';saveGame()}function showMessage(t){message.textContent=t}function gainXP(a){cat.xp+=a;if(cat.xp>=100){cat.level++;cat.xp-=100;showMessage('🎉 レベルアップ！')}updateUI()}function feed(){cat.hunger=Math.min(100,cat.hunger+20);gainXP(10);showMessage('😺 おいしいにゃ！')}function play(){cat.happy=Math.min(100,cat.happy+20);gainXP(15);showMessage('😻 たのしいにゃ！')}function sleepCat(){cat.hunger=Math.max(0,cat.hunger-10);cat.happy=Math.min(100,cat.happy+10);gainXP(8);showMessage('💤 ぐっすり寝たにゃ')}function saveName(){const v=catName.value;if(v.trim()){cat.name=v;updateUI();showMessage('🐾 名前を変更しました')}}function resetGame(){if(confirm('セーブデータを削除しますか？')){localStorage.removeItem('nyalife');location.reload()}}setInterval(()=>{cat.hunger=Math.max(0,cat.hunger-1);cat.happy=Math.max(0,cat.happy-1);updateUI()},30000);loadGame();</script></body></html>
