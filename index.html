<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NyaLife</title>
  <style>
    :root {
      --bg: #fff7ea;
      --panel: #fffdf9;
      --panel-border: #f3d7a1;
      --ink: #41362d;
      --muted: #7a6258;
      --accent: #ffb86c;
      --accent-2: #ff8c6b;
      --good: #67c7a9;
      --warn: #f5c75d;
      --bad: #eb7f7f;
      --shadow: rgba(92, 61, 39, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #fff7ea, #ffe4c4 100%);
      color: var(--ink);
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 20px 40px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.06em;
    }

    .chip {
      padding: 8px 14px;
      border-radius: 999px;
      background: #fff4d8;
      border: 1px solid var(--panel-border);
      color: var(--muted);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .game {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 22px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.78);
      border: 3px solid var(--panel-border);
      border-radius: 26px;
      box-shadow: 0 12px 30px var(--shadow);
      padding: 22px;
    }

    .cat-stage {
      position: relative;
      height: 330px;
      background: linear-gradient(180deg, #fffdf9, #f5f7ff);
      border-radius: 22px;
      border: 2px dashed #f0d8a9;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .cat-stage::before {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 70px;
      background: linear-gradient(180deg, rgba(64, 123, 92, 0.1), rgba(64, 123, 92, 0.3));
      border-radius: 22px 22px 0 0;
    }

    .cat-avatar {
      position: relative;
      z-index: 1;
      font-size: 150px;
      line-height: 1;
      filter: drop-shadow(0 18px 12px rgba(110, 80, 50, 0.10));
      animation: bob 2.6s ease-in-out infinite;
      user-select: none;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .cat-bubble {
      position: absolute;
      right: 18px;
      top: 18px;
      z-index: 2;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid #f1d9aa;
      font-weight: 700;
      box-shadow: 0 12px 18px rgba(100, 75, 50, 0.08);
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .meta-card {
      background: #fffdfb;
      border: 2px solid #f5e2b8;
      border-radius: 14px;
      padding: 10px 12px;
      text-align: center;
    }

    .meta-card .label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .meta-card strong {
      font-size: 1.3rem;
    }

    .stats {
      margin-top: 16px;
    }

    .stat-row {
      margin-bottom: 12px;
    }

    .stat-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.92rem;
      margin-bottom: 6px;
      color: var(--muted);
      font-weight: 700;
    }

    .bar {
      position: relative;
      height: 18px;
      background: #f4efe7;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #e8dcc1;
    }

    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 50%;
      border-radius: inherit;
      transition: width 0.3s ease;
    }

    .hunger { background: linear-gradient(90deg, #ffb957, #ff8a65); }
    .happiness { background: linear-gradient(90deg, #68d7b3, #46b7d8); }
    .energy { background: linear-gradient(90deg, #b0a7ff, #7a8aff); }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 14px;
      padding: 14px 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
      box-shadow: 0 8px 18px rgba(80, 55, 35, 0.08);
    }

    button:hover {
      transform: translateY(-1px) scale(1.01);
      filter: brightness(1.02);
    }

    .primary {
      background: linear-gradient(135deg, #ffcf70, #ff9f6c);
      color: #372719;
    }

    .secondary {
      background: linear-gradient(135deg, #dff6ec, #b4ebd1);
      color: #1d4d3e;
    }

    .danger {
      background: linear-gradient(135deg, #ffd4d5, #ffb6b8);
      color: #682b2b;
    }

    .message-box {
      margin-top: 18px;
      background: #fffaf2;
      border: 2px solid #f1dfb7;
      border-radius: 16px;
      padding: 14px 16px;
      line-height: 1.6;
      min-height: 70px;
      color: #483926;
    }

    .log {
      list-style: none;
      padding: 0;
      margin: 18px 0 0;
      display: grid;
      gap: 8px;
    }

    .log li {
      background: #fff8f0;
      border: 1px solid #f0d7a6;
      border-radius: 10px;
      padding: 8px 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 780px) {
      .game {
        grid-template-columns: 1fr;
      }

      .controls {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 480px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .meta {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🐾 NyaLife</h1>
      <div class="chip" id="dayChip">Day 1</div>
    </header>

    <main class="game">
      <section class="panel">
        <div class="cat-stage">
          <div class="cat-avatar" id="catAvatar">🐱</div>
          <div class="cat-bubble" id="catMood">にゃー</div>
        </div>

        <div class="meta">
          <div class="meta-card">
            <span class="label">名前</span>
            <strong id="catName">たま</strong>
          </div>
          <div class="meta-card">
            <span class="label">レベル</span>
            <strong id="level">1</strong>
          </div>
          <div class="meta-card">
            <span class="label">EXP</span>
            <strong id="xpText">0 / 100</strong>
          </div>
          <div class="meta-card">
            <span class="label">状態</span>
            <strong id="statusText">元気</strong>
          </div>
        </div>

        <div class="stats">
          <div class="stat-row">
            <div class="stat-head">
              <span>空腹度</span>
              <span id="hungerValue">70%</span>
            </div>
            <div class="bar"><div id="hungerBar" class="fill hunger"></div></div>
          </div>

          <div class="stat-row">
            <div class="stat-head">
              <span>幸福度</span>
              <span id="happinessValue">75%</span>
            </div>
            <div class="bar"><div id="happinessBar" class="fill happiness"></div></div>
          </div>

          <div class="stat-row">
            <div class="stat-head">
              <span>体力</span>
              <span id="energyValue">80%</span>
            </div>
            <div class="bar"><div id="energyBar" class="fill energy"></div></div>
          </div>
        </div>
      </section>

      <aside class="panel">
        <div class="controls">
          <button class="primary" data-action="feed">🍲 ごはん</button>
          <button class="primary" data-action="play">🎾 遊ぶ</button>
          <button class="primary" data-action="pet">🐾 なでる</button>
          <button class="primary" data-action="sleep">💤 ねる</button>
          <button class="secondary" id="saveBtn" type="button">💾 セーブ</button>
          <button class="danger" id="resetBtn" type="button">🔄 リセット</button>
        </div>

        <div class="message-box" id="messageBox">
          こんにちは！今日もよろしくにゃ。
        </div>

        <ul class="log" id="logList"></ul>
      </aside>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "nyalife-state-v1";

    const defaultState = {
      name: "たま",
      level: 1,
      xp: 0,
      hunger: 70,
      happiness: 75,
      energy: 80,
      day: 1,
      mood: "元気",
      log: ["今日も元気に過ごしてるにゃ！"]
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return null;
        const parsed = JSON.parse(saved);
        return { ...defaultState, ...parsed };
      } catch (error) {
        console.warn("セーブデータの読み込みに失敗:", error);
        return null;
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function addLog(text) {
      state.log.unshift(text);
      state.log = state.log.slice(0, 6);
    }

    function getMoodText() {
      if (state.hunger < 25) return "お腹すいたにゃ";
      if (state.happiness < 25) return "さみしいにゃ";
      if (state.energy < 25) return "眠いにゃ";
      if (state.happiness > 80 && state.hunger > 55) return "最高に幸せにゃ";
      return "元気にゃ";
    }

    function getAvatar() {
      const mood = getMoodText();
      if (mood.includes("眠")) return "😴";
      if (mood.includes("お腹")) return "😿";
      if (mood.includes("さみ")) return "😸";
      if (mood.includes("最高")) return "😺";
      return "🐱";
    }

    function gainXp(amount) {
      state.xp += amount;
      while (state.xp >= 100) {
        state.xp -= 100;
        state.level += 1;
        addLog(`レベルアップ！現在 Lv.${state.level}`);
      }
    }

    function updateUI() {
      const hunger = clamp(state.hunger, 0, 100);
      const happiness = clamp(state.happiness, 0, 100);
      const energy = clamp(state.energy, 0, 100);

      document.getElementById("catName").textContent = state.name;
      document.getElementById("level").textContent = String(state.level);
      document.getElementById("xpText").textContent = `${state.xp} / 100`;
      document.getElementById("statusText").textContent = getMoodText();
      document.getElementById("catMood").textContent = getMoodText();
      document.getElementById("catAvatar").textContent = getAvatar();
      document.getElementById("dayChip").textContent = `Day ${state.day}`;

      document.getElementById("hungerValue").textContent = `${hunger}%`;
      document.getElementById("happinessValue").textContent = `${happiness}%`;
      document.getElementById("energyValue").textContent = `${energy}%`;

      document.getElementById("hungerBar").style.width = `${hunger}%`;
      document.getElementById("happinessBar").style.width = `${happiness}%`;
      document.getElementById("energyBar").style.width = `${energy}%`;

      const logList = document.getElementById("logList");
      logList.innerHTML = "";
      state.log.forEach((entry) => {
        const li = document.createElement("li");
        li.textContent = entry;
        logList.appendChild(li);
      });
    }

    function setMessage(text) {
      document.getElementById("messageBox").textContent = text;
    }

    function act(type) {
      if (type === "feed") {
        state.hunger = clamp(state.hunger + 22, 0, 100);
        state.energy = clamp(state.energy + 4, 0, 100);
        state.happiness = clamp(state.happiness + 8, 0, 100);
        gainXp(12);
        addLog("ご飯を食べて満足したにゃ！");
        setMessage("おいしいごはんでお腹がいっぱいになったにゃ！");
      }

      if (type === "play") {
        state.happiness = clamp(state.happiness + 20, 0, 100);
        state.energy = clamp(state.energy - 12, 0, 100);
        state.hunger = clamp(state.hunger - 8, 0, 100);
        gainXp(15);
        addLog("遊んでとても楽しそうにゃ！");
        setMessage("おもいっきり遊んで、にゃんと笑ってるにゃ！");
      }

      if (type === "pet") {
        state.happiness = clamp(state.happiness + 14, 0, 100);
        state.energy = clamp(state.energy + 4, 0, 100);
        gainXp(8);
        addLog("なでなでで心が満たされたにゃ");
        setMessage("ちゅっとなでると、猫はとても幸せそうにゃ！");
      }

      if (type === "sleep") {
        state.energy = clamp(state.energy + 26, 0, 100);
        state.hunger = clamp(state.hunger - 10, 0, 100);
        state.happiness = clamp(state.happiness + 5, 0, 100);
        gainXp(9);
        addLog("ぐっすり眠って、体力が回復したにゃ");
        setMessage("よく眠って、今日も元気になったにゃ！");
      }

      state.day += 1;
      saveState();
      updateUI();
    }

    function tick() {
      state.hunger = clamp(state.hunger - 3, 0, 100);
      state.happiness = clamp(state.happiness - 2, 0, 100);
      state.energy = clamp(state.energy - 2, 0, 100);

      if (state.hunger <= 20) {
        setMessage("お腹が空いてるにゃ…ごはんをあげてほしいにゃ");
      } else if (state.energy <= 20) {
        setMessage("疲れたにゃ…少し休ませてあげてほしいにゃ");
      } else if (state.happiness <= 20) {
        setMessage("少し寂しいにゃ…なでてあげてほしいにゃ");
      }

      saveState();
      updateUI();
    }

    function resetGame() {
      const confirmed = window.confirm("本当にリセットしますか？");
      if (!confirmed) return;

      const fresh = JSON.parse(JSON.stringify(defaultState));
      Object.assign(state, fresh);
      saveState();
      updateUI();
      setMessage("新しい生活がはじまったにゃ！");
    }

    document.querySelectorAll("[data-action]").forEach((button) => {
      button.addEventListener("click", () => {
        const action = button.dataset.action;
        act(action);
      });
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
      saveState();
      setMessage("セーブしたにゃ！");
    });

    document.getElementById("resetBtn").addEventListener("click", resetGame);

    let state = loadState() || JSON.parse(JSON.stringify(defaultState));
    updateUI();
    setMessage("こんにちは！今日もよろしくにゃ.");
    setInterval(tick, 10000);
  </script>
</body>
</html>
